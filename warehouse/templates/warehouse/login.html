<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - Quản Lý Kho AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
            color: #333333;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background-color: #ffffff;
            border-color: #e3e6f0;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>

<body>
    <div class="card p-4 rounded-4 shadow-sm">
        <h3 class="fw-bold text-center text-primary mb-2"><i class="bi bi-box-seam me-2"></i>QUẢN LÝ KHO AI</h3>
        <p class="text-center text-muted mb-4">Vui lòng đăng nhập để tiếp tục</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 text-center" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Tên đăng nhập</label>
                <input type="text" name="ten_dang_nhap" class="form-control" required placeholder="Nhập tên đăng nhập...">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Mật khẩu</label>
                <input type="password" name="password" class="form-control" required placeholder="Nhập mật khẩu...">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Đăng Nhập</button>
        </form>
    </div>
</body>

</html>
