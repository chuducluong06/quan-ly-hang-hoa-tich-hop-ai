{% load static %}
{% if not task_menu_in_base %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="{% static 'warehouse/task-menu.css' %}">
{% endif %}
<div
    id="taskMenuConfig"
    data-username="{{ request.session.username|default:'' }}"
    data-role="{{ request.session.role|default:'' }}"
    data-is-admin="{% if request.session.role == 'ADMIN' or request.session.username|lower == 'admin' or request.user.is_superuser or request.user.is_staff %}true{% else %}false{% endif %}"
    data-global-search-url="{% url 'global_search' %}"
></div>
<template id="taskMenuTemplate">
    <aside class="task-sidebar" aria-label="Điều hướng chính">
        <a class="task-brand" href="{% url 'dashboard' %}">
            <span class="task-brand-icon"><i class="bi bi-box-seam-fill"></i></span>
            <span>
                <strong>Quản Lý Kho AI</strong>
                <small>Smart Inventory</small>
            </span>
        </a>
        <nav class="task-navigation">
            <span class="task-nav-heading">Tổng quan</span>
            <a href="{% url 'dashboard' %}" data-task-route="dashboard"><i class="bi bi-speedometer2"></i><span>Bảng điều khiển</span></a>

            <span class="task-nav-heading">Nghiệp vụ kho</span>
            <a href="{% url 'phieu_nhap_list' %}" data-task-route="phieu_nhap_list"><i class="bi bi-box-arrow-in-down"></i><span>Nhập kho</span></a>
            <a href="{% url 'phieu_xuat_list' %}" data-task-route="phieu_xuat_list"><i class="bi bi-box-arrow-up-right"></i><span>Xuất kho</span></a>
            <a href="{% url 'thong_ke_nxt' %}" data-task-route="thong_ke_nxt"><i class="bi bi-file-earmark-bar-graph"></i><span>Báo cáo NXT</span></a>

            <span class="task-nav-heading">Quản lý danh mục</span>
            <a href="{% url 'san_pham_list' %}" data-task-route="san_pham_list"><i class="bi bi-boxes"></i><span>Hàng hóa & kho</span></a>
            <a href="{% url 'nhom_hang_list' %}" data-task-route="nhom_hang_list"><i class="bi bi-tags"></i><span>Nhóm hàng</span></a>
            <a href="{% url 'don_vi_tinh_list' %}" data-task-route="don_vi_tinh_list"><i class="bi bi-rulers"></i><span>Đơn vị tính</span></a>
            <a href="{% url 'nha_cung_cap_list' %}" data-task-route="nha_cung_cap_list"><i class="bi bi-truck"></i><span>Nhà cung cấp</span></a>

            <span class="task-nav-heading">Trí tuệ nhân tạo</span>
            <a href="{% url 'ai_assistant' %}" data-task-route="ai_assistant"><i class="bi bi-robot"></i><span>Dự báo & trợ lý AI</span></a>

            {% if request.session.role == 'ADMIN' or request.session.username|lower == 'admin' or request.user.is_superuser or request.user.is_staff %}
                <span class="task-nav-heading task-admin-heading">Quản trị hệ thống</span>
                <a href="{% url 'quan_ly_tai_khoan' %}" data-task-route="quan_ly_tai_khoan"><i class="bi bi-people-fill"></i><span>Quản lý người dùng</span></a>
                <a href="{% url 'nhat_ky_hoat_dong' %}" data-task-route="nhat_ky_hoat_dong"><i class="bi bi-clock-history"></i><span>Nhật ký hoạt động</span></a>
                <a href="{% url 'admin_settings' %}" data-task-route="admin_settings"><i class="bi bi-gear"></i><span>Cài đặt hệ thống</span></a>
            {% endif %}
        </nav>
        <div class="task-sidebar-footer">
            <span class="task-user-avatar" data-task-avatar></span>
            <span class="task-user-copy">
                <strong data-task-username></strong>
                <small data-task-role></small>
            </span>
            <a href="{% url 'logout' %}" aria-label="Đăng xuất" title="Đăng xuất"><i class="bi bi-box-arrow-right"></i></a>
        </div>
    </aside>
</template>
{% if not task_menu_in_base %}
<script src="{% static 'warehouse/task-menu.js' %}" defer></script>
{% endif %}
