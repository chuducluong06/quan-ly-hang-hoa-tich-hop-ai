<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo Phiếu Xuất Kho - Warehouse AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 p-6 md:p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow border border-gray-200">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 flex items-center">
                <i class="fa-solid fa-file-export text-red-600 mr-2"></i> Lập Phiếu Xuất Kho
            </h2>
            <a href="{% url 'phieu_xuat_list' %}" class="text-gray-500 hover:text-gray-700 text-sm font-medium flex items-center">
                <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại
            </a>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-4 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% elif message.tags == 'success' %}bg-green-50 border border-green-200 text-green-700{% else %}bg-blue-50 border border-blue-200 text-blue-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Mã phiếu <span class="text-red-500">*</span></label>
                    <input type="text" name="ma_phieu" value="{{ ma_phieu_tu_dong }}" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                    <p class="text-xs text-gray-400 mt-1">Mã phiếu được tạo tự động, bạn có thể chỉnh sửa.</p>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Người nhận / Khách hàng <span class="text-red-500">*</span></label>
                    <input type="text" name="nguoi_nhan" required placeholder="VD: Khách lẻ, Công ty ABC..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                </div>
            </div>

            <div class="border-t pt-4">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-semibold text-gray-700">Danh sách hàng hóa xuất kho</h3>
                    <button type="button" onclick="themDongHang()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-3 py-1.5 rounded-lg border flex items-center gap-1 transition">
                        <i class="fa-solid fa-plus text-red-600"></i> Thêm mặt hàng
                    </button>
                </div>

                <div class="bg-gray-50 p-4 rounded-lg border space-y-3">
                    <div class="grid grid-cols-12 gap-2 text-xs font-semibold text-gray-500 uppercase px-1">
                        <div class="col-span-5">Sản phẩm (Tồn kho)</div>
                        <div class="col-span-3">Số lượng xuất</div>
                        <div class="col-span-3">Đơn giá xuất (VNĐ)</div>
                        <div class="col-span-1 text-center">Xóa</div>
                    </div>

                    <div id="danhSachHangContainer" class="space-y-2">
                        <div class="hang-item grid grid-cols-12 gap-2 items-center">
                            <div class="col-span-5">
                                <select name="hang_hoa_id[]" onchange="capNhatGia(this)" class="select-hang w-full px-3 py-2 border rounded-lg bg-white text-sm focus:ring-2 focus:ring-red-500 outline-none" required>
                                    <option value="" disabled selected>-- Chọn sản phẩm --</option>
                                    {% for hang in danh_sach_hang %}
                                    <option value="{{ hang.id }}" data-gia="{{ hang.gia_xuat }}" data-ton="{{ hang.so_luong_ton }}">
                                        {{ hang.ma_hang }} - {{ hang.ten_hang }} (Tồn: {{ hang.so_luong_ton }})
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-span-3">
                                <input type="number" name="so_luong[]" value="1" min="1" required class="input-sl w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-red-500 outline-none">
                            </div>
                            <div class="col-span-3">
                                <input type="number" step="any" name="don_gia[]" value="0" min="0" required class="input-gia w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-red-500 outline-none">
                            </div>
                            <div class="col-span-1 text-center">
                                <button type="button" onclick="xoaDongHang(this)" class="text-gray-400 hover:text-red-600 transition p-1" title="Xóa dòng này">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Ghi chú</label>
                <textarea name="ghi_chu" rows="3" placeholder="Lý do xuất kho, ghi chú thêm..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none"></textarea>
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t">
                <a href="{% url 'phieu_xuat_list' %}" class="px-5 py-2 rounded-lg border text-gray-600 hover:bg-gray-100 text-sm font-medium">Hủy</a>
                <button type="submit" class="px-5 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-semibold shadow transition">
                    <i class="fa-solid fa-check mr-1"></i> Lưu phiếu xuất
                </button>
            </div>
        </form>
    </div>

    <script>
        function capNhatGia(selectElement) {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const gia = selectedOption.getAttribute('data-gia') || 0;
            const ton = selectedOption.getAttribute('data-ton') || 0;
            
            const row = selectElement.closest('.hang-item');
            const giaInput = row.querySelector('.input-gia');
            const slInput = row.querySelector('.input-sl');
            
            if (giaInput) giaInput.value = parseFloat(gia);
            if (slInput) {
                slInput.max = parseInt(ton);
                if (parseInt(ton) <= 0) {
                    slInput.value = 0;
                } else if (parseInt(slInput.value) > parseInt(ton)) {
                    slInput.value = ton;
                }
            }
        }

        function themDongHang() {
            const container = document.getElementById('danhSachHangContainer');
            const firstRow = container.querySelector('.hang-item');
            if (!firstRow) return;
            
            const newRow = firstRow.cloneNode(true);
            const select = newRow.querySelector('.select-hang');
            const sl = newRow.querySelector('.input-sl');
            const gia = newRow.querySelector('.input-gia');
            
            select.selectedIndex = 0;
            sl.value = 1;
            gia.value = 0;
            
            container.appendChild(newRow);
        }

        function xoaDongHang(btn) {
            const container = document.getElementById('danhSachHangContainer');
            const rows = container.querySelectorAll('.hang-item');
            if (rows.length > 1) {
                btn.closest('.hang-item').remove();
            } else {
                alert('Phiếu xuất phải có ít nhất một mặt hàng.');
            }
        }

        // Tự động kích hoạt cập nhật giá cho dòng đầu tiên nếu đã có sản phẩm được chọn
        document.addEventListener('DOMContentLoaded', () => {
            const firstSelect = document.querySelector('.select-hang');
            if (firstSelect && firstSelect.value) {
                capNhatGia(firstSelect);
            }
        });
    </script>
</body>
</html>
